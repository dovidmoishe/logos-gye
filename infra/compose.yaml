services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: logos_local
      POSTGRES_DB: logos_gye
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logos -d logos_gye"]
      interval: 3s
      timeout: 3s
      retries: 15
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: api
    environment:
      DATABASE_URL: postgresql://logos:logos_local@postgres:5432/logos_gye
    depends_on:
      postgres:
        condition: service_healthy
  dashboard:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: dashboard
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
volumes:
  postgres-data:
