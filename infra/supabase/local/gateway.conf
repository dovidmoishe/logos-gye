server {
    listen 8080;
    listen 8443 ssl;
    ssl_certificate /etc/nginx/logos/cert.pem;
    ssl_certificate_key /etc/nginx/logos/key.pem;
    access_log off;
    location = /email-code.html { root /usr/share/nginx/html; }
    location ~ ^/auth/v1/(otp|verify|token|logout|\.well-known/jwks\.json)$ {
        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass http://auth:9999;
    }
    location /api/ { proxy_pass http://api:3001; }
    location /auth/ { return 404; }
    location / { proxy_pass http://web:3000; }
}
